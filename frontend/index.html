<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClinicalCare: gestão de clínicas, pacientes, agenda e indicadores em um só lugar." />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ClinicalCare</title>
    <script>
      // Aplica o tema antes da renderização para evitar flash de cor.
      (function () {
        try {
          var stored = localStorage.getItem('clinicalcare.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
